name: flutter_hw32
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+42

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  cloud_firestore: ^5.6.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^19.4.2
  get_it: ^8.0.3
  google_sign_in: ^6.2.2
  provider: ^6.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: web/icons/Icon-512.png
  adaptive_icon_background: "#3F51B5"
  adaptive_icon_foreground: web/icons/Icon-512.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#111827"
  image: web/icons/Icon-512.png
  image_dark: web/icons/Icon-512.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#111827"
    image: web/icons/Icon-512.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#111827"
